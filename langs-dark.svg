<svg xmlns="http://www.w3.org/2000/svg" width="440" height="195" viewBox="0 0 440 195" fill="none" role="img">
<style>
  text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
  .title { font-size: 18px; font-weight: 600; fill: #3fb6c0; }
  .lbl { font-size: 14px; fill: #e6edf3; }
  .val { font-size: 14px; font-weight: 700; fill: #e6edf3; }
  .muted { font-size: 12px; fill: #8b949e; }
  .rise { animation: rise .6s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .grow { transform-origin: 25px 60px; animation: grow 1s ease-out both; } @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  
</style>
