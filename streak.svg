<svg xmlns="http://www.w3.org/2000/svg" width="880" height="195" viewBox="0 0 880 195" fill="none" role="img">
<style>
  text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
  .title { font-size: 18px; font-weight: 600; fill: #0e7c86; }
  .lbl { font-size: 14px; fill: #1f2328; }
  .val { font-size: 14px; font-weight: 700; fill: #1f2328; }
  .muted { font-size: 12px; fill: #59636e; }
  .rise { animation: rise .6s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .ring { animation: ring 1.4s .2s ease-out both; } @keyframes ring { from { stroke-dashoffset: 251.3; } to { stroke-dashoffset: 0; } }
  
</style>
<line x1="293" y1="30" x2="293" y2="165" stroke="#d0d7de"/><line x1="587" y1="30" x2="587" y2="165" stroke="#d0d7de"/><g class="rise"><text x="147" y="88" text-anchor="middle" class="val" style="font-size:30px;fill:#0e7c86">255</text><text x="147" y="122" text-anchor="middle" class="lbl">Total contributions</text><text x="147" y="146" text-anchor="middle" class="muted">Feb 24, 2022 – Present</text></g><g transform="translate(440 70)" class="rise" style="animation-delay:200ms">
    <circle r="40" stroke="#e6eef0" stroke-width="6"/>
    <circle r="40" stroke="#8a5a2b" stroke-width="6" stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="251.3" class="ring"/>
    <text y="10" text-anchor="middle" class="val" style="font-size:28px;fill:#8a5a2b">1</text>
  </g>
  <g class="rise" style="animation-delay:300ms"><text x="440" y="140" text-anchor="middle" class="val" style="fill:#8a5a2b">Current streak</text><text x="440" y="162" text-anchor="middle" class="muted">Nov 14</text></g><g class="rise" style="animation-delay:400ms"><text x="733" y="88" text-anchor="middle" class="val" style="font-size:30px;fill:#0e7c86">9</text><text x="733" y="122" text-anchor="middle" class="lbl">Longest streak</text><text x="733" y="146" text-anchor="middle" class="muted">Oct 23 – Oct 31</text></g>
</svg>