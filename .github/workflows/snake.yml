name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0e7c86&color_dots=#ebedf0,#b9e3e6,#6cc4cb,#1f9aa5,#0e6f78
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#3fb6c0&color_dots=#161b22,#0f3a3e,#14666d,#1f9aa5,#5fd3dc

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
